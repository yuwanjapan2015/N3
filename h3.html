<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hafalan N3 Hari 3</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: satu kolom sempit, soal berurutan, bilah progres menempel di atas, hasil muncul di bawah setelah Finish */
:root{
  --bg:#f6f7fa; --surface:#ffffff; --fg:#1b1f2a; --muted:#5c6475; --line:#d9dde6;
  --accent:#2c4f9e; --accent-fg:#ffffff; --pick:#e6ecfa; --good:#17663a; --good-bg:#e3f3ea; --bad:#a32424; --bad-bg:#fbe7e7;
  --font-body:'Inter','Noto Sans JP',system-ui,sans-serif; --font-jp:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b2029; --fg:#e8ebf2; --muted:#a2a9b8; --line:#333a48;
  --accent:#8fb0ff; --accent-fg:#101624; --pick:#26324f; --good:#7ddba0; --good-bg:#17301f; --bad:#ff9d9d; --bad-bg:#3a1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b2029; --fg:#e8ebf2; --muted:#a2a9b8; --line:#333a48;
  --accent:#8fb0ff; --accent-fg:#101624; --pick:#26324f; --good:#7ddba0; --good-bg:#17301f; --bad:#ff9d9d; --bad-bg:#3a1c1c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:0 0 4px;font-family:var(--font-jp);text-wrap:balance}
.lead{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar-row{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;margin:0 0 12px;min-width:0}
.q legend{padding:0}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.qt{font-family:var(--font-jp);font-size:1.05rem;font-weight:500;margin:0 0 10px;overflow-wrap:anywhere}
.passage{font-family:var(--font-jp);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:.95rem;line-height:1.8}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-family:var(--font-jp);overflow-wrap:anywhere}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt:has(input:checked){background:var(--pick);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.locked .opt{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
button{font:inherit;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.hint{color:var(--muted);font-size:.85rem}
.res{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.score{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.res h2{font-size:1.05rem;margin:18px 0 8px}
.rv{border-top:1px solid var(--line);padding:12px 0}
.rv .qt{margin-bottom:6px}
.line{font-size:.92rem;font-family:var(--font-jp)}
.line b.n{color:var(--bad)} .line b.y{color:var(--good)}
.ex{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>


<div class="wrap">
  <h1>JLPT N3 単語 · Hari 3</h1>
  <p class="lead">25 soal hafalan kosakata Hari 3, satu soal per kata: tebak arti dari kanji, atau tebak kanji dari arti. Jawab semua, lalu tekan Finish.</p>

  <div class="bar" role="status">
    <div class="bar-row"><span id="cnt">Terjawab 0 / 25</span><span id="pct">0%</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <form id="quiz" novalidate></form>

  <div class="act">
    <button type="button" id="finish" disabled>Finish</button>
    <span class="hint" id="hint">Tombol aktif setelah semua soal terjawab.</span>
  </div>

  <section class="res" id="res" hidden aria-live="polite"></section>
</div>

<script>
var Q=[
{
"t": "Kanji → arti",
"q": "値段",
"o": [
"akhirnya (setelah lama)",
"harga",
"barang dagangan",
"anggaran"
],
"a": 1,
"e": "値段（ねだん） = harga."
},
{
"t": "Arti → kanji / kata",
"q": "「diskon」",
"o": [
"領収書",
"家賃",
"割引",
"ついに"
],
"a": 2,
"e": "割引（わりびき） = diskon."
},
{
"t": "Kanji → arti",
"q": "支払い",
"o": [
"setidaknya",
"pada akhirnya",
"pembayaran",
"dompet"
],
"a": 2,
"e": "支払い（しはらい） = pembayaran."
},
{
"t": "Arti → kanji / kata",
"q": "「uang tunai」",
"o": [
"ついに",
"だいたい",
"家賃",
"現金"
],
"a": 3,
"e": "現金（げんきん） = uang tunai."
},
{
"t": "Kanji → arti",
"q": "税金",
"o": [
"anggaran",
"pembayaran",
"pajak",
"pesanan"
],
"a": 2,
"e": "税金（ぜいきん） = pajak."
},
{
"t": "Arti → kanji / kata",
"q": "「uang sewa」",
"o": [
"家賃",
"安売り",
"領収書",
"配達"
],
"a": 0,
"e": "家賃（やちん） = uang sewa."
},
{
"t": "Kanji → arti",
"q": "貯金",
"o": [
"barang",
"sebisa mungkin",
"menukar",
"tabungan"
],
"a": 3,
"e": "貯金（ちょきん） = tabungan."
},
{
"t": "Arti → kanji / kata",
"q": "「dompet」",
"o": [
"財布",
"注文",
"結局",
"思わず"
],
"a": 0,
"e": "財布（さいふ） = dompet."
},
{
"t": "Kanji → arti",
"q": "領収書",
"o": [
"uang sewa",
"barang dagangan",
"kwitansi",
"pada akhirnya"
],
"a": 2,
"e": "領収書（りょうしゅうしょ） = kwitansi."
},
{
"t": "Arti → kanji / kata",
"q": "「anggaran」",
"o": [
"予算",
"領収書",
"注文",
"安売り"
],
"a": 0,
"e": "予算（よさん） = anggaran."
},
{
"t": "Kanji → arti",
"q": "商品",
"o": [
"pengembalian barang",
"barang dagangan",
"pajak",
"sebenarnya"
],
"a": 1,
"e": "商品（しょうひん） = barang dagangan."
},
{
"t": "Arti → kanji / kata",
"q": "「barang」",
"o": [
"実は",
"貯金",
"品物",
"財布"
],
"a": 2,
"e": "品物（しなもの） = barang."
},
{
"t": "Kanji → arti",
"q": "安売り",
"o": [
"sebisa mungkin",
"menukar",
"obral",
"pesanan"
],
"a": 2,
"e": "安売り（やすうり） = obral."
},
{
"t": "Arti → kanji / kata",
"q": "「pengembalian barang」",
"o": [
"返品",
"割引",
"財布",
"税金"
],
"a": 0,
"e": "返品（へんぴん） = pengembalian barang."
},
{
"t": "Kanji → arti",
"q": "交換",
"o": [
"menukar",
"sebisa mungkin",
"kwitansi",
"uang sewa"
],
"a": 0,
"e": "交換（こうかん） = menukar."
},
{
"t": "Arti → kanji / kata",
"q": "「pesanan」",
"o": [
"品物",
"注文",
"思わず",
"貯金"
],
"a": 1,
"e": "注文（ちゅうもん） = pesanan."
},
{
"t": "Kanji → arti",
"q": "配達",
"o": [
"spontan, refleks",
"sekitar, umumnya",
"pengantaran",
"dompet"
],
"a": 2,
"e": "配達（はいたつ） = pengantaran."
},
{
"t": "Arti → kanji / kata",
"q": "「sia-sia, boros」",
"o": [
"無駄",
"実は",
"割引",
"思わず"
],
"a": 0,
"e": "無駄（むだ） = sia-sia, boros."
},
{
"t": "Kanji → arti",
"q": "結局",
"o": [
"tabungan",
"pada akhirnya",
"anggaran",
"uang sewa"
],
"a": 1,
"e": "結局（けっきょく） = pada akhirnya."
},
{
"t": "Arti → kanji / kata",
"q": "「sebenarnya」",
"o": [
"財布",
"実は",
"家賃",
"支払い"
],
"a": 1,
"e": "実は（じつは） = sebenarnya."
},
{
"t": "Kanji → arti",
"q": "だいたい",
"o": [
"menukar",
"sebisa mungkin",
"barang dagangan",
"sekitar, umumnya"
],
"a": 3,
"e": "だいたい = sekitar, umumnya."
},
{
"t": "Arti → kanji / kata",
"q": "「sebisa mungkin」",
"o": [
"なるべく",
"予算",
"税金",
"現金"
],
"a": 0,
"e": "なるべく = sebisa mungkin."
},
{
"t": "Kanji → arti",
"q": "ついに",
"o": [
"spontan, refleks",
"sebenarnya",
"pada akhirnya",
"akhirnya (setelah lama)"
],
"a": 3,
"e": "ついに = akhirnya (setelah lama)."
},
{
"t": "Arti → kanji / kata",
"q": "「spontan, refleks」",
"o": [
"商品",
"割引",
"思わず",
"値段"
],
"a": 2,
"e": "思わず（おもわず） = spontan, refleks."
},
{
"t": "Kanji → arti",
"q": "せめて",
"o": [
"pesanan",
"setidaknya",
"pengantaran",
"sia-sia, boros"
],
"a": 1,
"e": "せめて = setidaknya."
}
];
var N=Q.length, ans=new Array(N).fill(-1), done=false;
var form=document.getElementById('quiz'), btn=document.getElementById('finish');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  var h='';
  Q.forEach(function(x,i){
    h+='<fieldset class="q" id="q'+i+'" style="border:1px solid var(--line)"><legend><span class="tag">'+(i+1)+' / '+N+' · '+esc(x.t)+'</span></legend>';
    if(x.p) h+='<div class="passage">'+esc(x.p)+'</div>';
    h+='<p class="qt">'+esc(x.q)+'</p>';
    x.o.forEach(function(o,j){
      h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" id="r'+i+'_'+j+'" value="'+j+'"><span>'+(j+1)+'. '+esc(o)+'</span></label>';
    });
    h+='</fieldset>';
  });
  form.innerHTML=h;
}
function update(){
  var n=ans.filter(function(v){return v>=0;}).length;
  document.getElementById('cnt').textContent='Terjawab '+n+' / '+N;
  document.getElementById('pct').textContent=Math.round(n/N*100)+'%';
  document.getElementById('fill').style.width=(n/N*100)+'%';
  btn.disabled=(n<N)||done;
  document.getElementById('hint').textContent=n<N?'Tombol aktif setelah semua soal terjawab ('+(N-n)+' lagi).':'Semua terjawab. Tekan Finish untuk melihat hasil.';
}
form.addEventListener('change',function(e){
  if(done||!e.target.name)return;
  var i=parseInt(e.target.name.slice(1),10);
  ans[i]=parseInt(e.target.value,10);
  update();
});
btn.addEventListener('click',function(){
  done=true; form.classList.add('locked');
  var ok=0, wrong=[];
  Q.forEach(function(x,i){
    document.getElementById('r'+i+'_0');
    for(var j=0;j<x.o.length;j++){document.getElementById('r'+i+'_'+j).disabled=true;}
    document.getElementById('o'+i+'_'+x.a).classList.add('right');
    if(ans[i]===x.a){ok++;} else {wrong.push(i); document.getElementById('o'+i+'_'+ans[i]).classList.add('wrong');}
  });
  var r=document.getElementById('res'), h='';
  h+='<div class="score">'+ok+' / '+N+'</div>';
  h+='<div class="hint">Nilai '+Math.round(ok/N*100)+'%. '+(wrong.length?('Ada '+wrong.length+' jawaban yang salah, penjelasannya di bawah.'):'Semua benar. Sempurna!')+'</div>';
  if(wrong.length){
    h+='<h2>Pembahasan jawaban yang salah</h2>';
    wrong.forEach(function(i){
      var x=Q[i];
      h+='<div class="rv"><span class="tag">Soal '+(i+1)+' · '+esc(x.t)+'</span>';
      if(x.p) h+='<div class="passage">'+esc(x.p)+'</div>';
      h+='<p class="qt">'+esc(x.q)+'</p>';
      h+='<div class="line"><b class="n">Jawabanmu:</b> '+(ans[i]+1)+'. '+esc(x.o[ans[i]])+'</div>';
      h+='<div class="line"><b class="y">Yang benar:</b> '+(x.a+1)+'. '+esc(x.o[x.a])+'</div>';
      h+='<p class="ex">'+esc(x.e)+'</p></div>';
    });
  }
  h+='<div class="act"><button type="button" class="ghost" id="again">Ulangi kuis</button></div>';
  r.innerHTML=h; r.hidden=false; btn.disabled=true;
  document.getElementById('hint').textContent='Kuis selesai.';
  r.scrollIntoView({behavior:'smooth',block:'start'});
  document.getElementById('again').addEventListener('click',reset);
});
function reset(){
  ans=new Array(N).fill(-1); done=false; form.classList.remove('locked');
  document.getElementById('res').hidden=true; render(); update();
  window.scrollTo({top:0,behavior:'smooth'});
}
render(); update();
</script>

</body>
</html>
